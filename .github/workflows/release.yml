name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches CMake VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version="$(python3 -c 'import re,sys; t=open("CMakeLists.txt").read(); m=re.search(r"project\(\s*drop-zone\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", t); sys.exit("no VERSION in CMakeLists.txt") if not m else print(m.group(1))')"
          if [[ "$tag" != "$project_version" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match CMake VERSION ${project_version}" >&2
            exit 1
          fi

      - name: Source tarball checksum
        id: tarball
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          tmp="$(mktemp)"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL "$url" -o "$tmp"; then
              break
            fi
            sleep 3
          done
          test -s "$tmp"
          sha="$(sha256sum "$tmp" | awk '{print $1}')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "Source tarball SHA-256: ${sha}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          ## Highlights

          - Ephemeral groups: \`accept --group=NAME\` / \`send FILE --group=NAME\`
          - More reliable fallback to the server relay on restricted networks
            (campus Wi‑Fi), so \`--force-transport=relay\` is no longer required

          ## Install

          \`\`\`sh
          brew install DTYoda/tap/drop-zone
          \`\`\`

          Or build from the source archive below with
          \`-DDZ_BUILD_SERVER=OFF\`.

          ## Source archive for packagers

          \`\`\`
          url "${{ steps.tarball.outputs.url }}"
          sha256 "${{ steps.tarball.outputs.sha256 }}"
          \`\`\`

          Paste those two lines into \`packaging/homebrew/drop-zone.rb\` and
          \`Formula/drop-zone.rb\` in [DTYoda/homebrew-tap](https://github.com/DTYoda/homebrew-tap)
          (or run \`packaging/homebrew/fill-stable.sh ${{ github.ref_name }}\`).
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "drop-zone ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"
