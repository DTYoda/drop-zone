name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libssl-dev pkg-config

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDZ_NATIVE_ARCH=OFF
          -DDZ_BUILD_CLIENT=ON
          -DDZ_BUILD_SERVER=ON
          -DDZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -R '^unit$'

      - name: End-to-end loopback
        run: ./tests/e2e_loopback.sh build 4
