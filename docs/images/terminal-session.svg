<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="drop-zone terminal session">
  <rect width="960" height="440" rx="16" fill="#0c1220"/>
  <text x="40" y="38" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f1ea">A typical session</text>
  <text x="40" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b95a8">Receiver waits. Sender names a username. Both sides pin fingerprints on first contact.</text>

  <rect x="40" y="88" width="430" height="320" rx="12" fill="#12161f" stroke="#2a3348" stroke-width="1.5"/>
  <rect x="40" y="88" width="430" height="36" rx="12" fill="#222a3c"/>
  <rect x="40" y="112" width="430" height="12" fill="#222a3c"/>
  <circle cx="62" cy="106" r="5" fill="#ff5f56"/>
  <circle cx="80" cy="106" r="5" fill="#ffbd2e"/>
  <circle cx="98" cy="106" r="5" fill="#27c93f"/>
  <text x="255" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b95a8">receiver</text>

  <text x="60" y="150" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#5ec4b4">$ <tspan fill="#e8eef7">drop-zone accept</tspan></text>
  <text x="60" y="178" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">accepting as bob, saving into ./</text>
  <text x="60" y="202" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">fingerprint 0f8b9690...5b9ea2</text>
  <text x="60" y="226" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">accepting as bob</text>
  <text x="60" y="258" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c4d0e0">First time seeing alice.</text>
  <text x="60" y="282" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c4d0e0">Their fingerprint is 3cc6e589...004a2c</text>
  <text x="60" y="314" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">introduced to alice;</text>
  <text x="60" y="338" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">negotiating a path...</text>
  <text x="60" y="370" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#5ec4b4">receiving demo.bin  8.0 MiB</text>
  <text x="60" y="394" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#5ec4b4">in 0.03s (266.7 MiB/s)  AES-256-GCM</text>

  <rect x="490" y="88" width="430" height="320" rx="12" fill="#12161f" stroke="#2a3348" stroke-width="1.5"/>
  <rect x="490" y="88" width="430" height="36" rx="12" fill="#222a3c"/>
  <rect x="490" y="112" width="430" height="12" fill="#222a3c"/>
  <circle cx="512" cy="106" r="5" fill="#ff5f56"/>
  <circle cx="530" cy="106" r="5" fill="#ffbd2e"/>
  <circle cx="548" cy="106" r="5" fill="#27c93f"/>
  <text x="705" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b95a8">sender</text>

  <text x="510" y="150" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#5ec4b4">$ <tspan fill="#e8eef7">drop-zone send demo.bin -t bob</tspan></text>
  <text x="510" y="178" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">sending demo.bin (8.0 MiB</text>
  <text x="510" y="202" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">across 1 file) to bob</text>
  <text x="510" y="234" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c4d0e0">First time seeing bob.</text>
  <text x="510" y="258" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c4d0e0">Their fingerprint is 0f8b9690...5b9ea2</text>
  <text x="510" y="298" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#5ec4b4">sending demo.bin  8.0 MiB</text>
  <text x="510" y="322" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#5ec4b4">in 0.03s (275.9 MiB/s)  AES-256-GCM</text>
  <text x="510" y="354" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8b95a8">saved on bob in ./</text>
</svg>
