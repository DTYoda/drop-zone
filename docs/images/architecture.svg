<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="drop-zone architecture">
  <rect width="960" height="420" rx="16" fill="#0c1220"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f1ea">How drop-zone moves a file</text>
  <text x="40" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b95a8">Rendezvous introduces peers. Bytes travel on the best path the two machines can open.</text>

  <rect x="48" y="120" width="200" height="180" rx="14" fill="#121a2b" stroke="#3d5a80" stroke-width="1.5"/>
  <circle cx="148" cy="168" r="22" fill="#243656" stroke="#5ec4b4" stroke-width="2"/>
  <text x="148" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5ec4b4">S</text>
  <text x="148" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Sender</text>
  <text x="148" y="238" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">drop-zone send</text>
  <text x="148" y="258" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">report.pdf -t bob</text>

  <rect x="712" y="120" width="200" height="180" rx="14" fill="#121a2b" stroke="#3d5a80" stroke-width="1.5"/>
  <circle cx="812" cy="168" r="22" fill="#243656" stroke="#5ec4b4" stroke-width="2"/>
  <text x="812" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5ec4b4">R</text>
  <text x="812" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Receiver</text>
  <text x="812" y="238" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">drop-zone accept</text>
  <text x="812" y="258" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b95a8">waiting as bob</text>

  <rect x="360" y="100" width="240" height="120" rx="14" fill="#1a1510" stroke="#c07840" stroke-width="1.5"/>
  <text x="480" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f0a060">Rendezvous server</text>
  <text x="480" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c4a882">Switchboard only</text>
  <text x="480" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a7a68">No passwords, filenames, or file bytes</text>
  <text x="480" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a7a68">No disk storage</text>

  <line x1="248" y1="160" x2="360" y2="145" stroke="#f0a060" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="360,145 350,140 350,150" fill="#f0a060"/>
  <line x1="600" y1="145" x2="712" y2="160" stroke="#f0a060" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="712,160 702,154 702,166" fill="#f0a060"/>
  <text x="480" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#f0a060">1. introduce (keys + candidates)</text>

  <path d="M248 260 C400 340 560 340 712 260" fill="none" stroke="#5ec4b4" stroke-width="3"/>
  <polygon points="712,260 700,254 702,268" fill="#5ec4b4"/>
  <rect x="390" y="318" width="180" height="28" rx="8" fill="#152033" stroke="#2d4a4a"/>
  <text x="480" y="337" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5ec4b4">2. transfer peer-to-peer</text>

  <line x1="48" y1="380" x2="76" y2="380" stroke="#f0a060" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="84" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b95a8">control / introduction</text>
  <line x1="280" y1="380" x2="308" y2="380" stroke="#5ec4b4" stroke-width="3"/>
  <text x="316" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b95a8">encrypted file bytes (TCP, UDP, or relay)</text>
</svg>
