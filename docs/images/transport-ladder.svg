<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">drop-zone transport ladder</title>
  <desc id="desc">Peers try direct TCP, then hole-punched UDP, then server relay of ciphertext.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#151d2e"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3d36"/>
      <stop offset="100%" stop-color="#152a32"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3348"/>
      <stop offset="100%" stop-color="#152436"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#2a1e14"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="16" fill="url(#bg)"/>
  <text x="40" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f4f1ea">Transport ladder</text>
  <text x="40" y="66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#8b95a8">Both peers walk the same tiers. A tier only wins after a two-way authenticated handshake.</text>

  <!-- Tier 1 -->
  <rect x="48" y="100" width="864" height="64" rx="12" fill="url(#t1)" stroke="#3d8f7a" stroke-width="1.5"/>
  <circle cx="88" cy="132" r="18" fill="#244840" stroke="#5ec4b4" stroke-width="2"/>
  <text x="88" y="137" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#5ec4b4">1</text>
  <text x="124" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Direct TCP</text>
  <text x="124" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b95a8">Fastest path when either side can dial the other ù sendfile when encryption is off</text>
  <text x="880" y="137" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#5ec4b4">preferred</text>

  <text x="480" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7280">? if that fails</text>

  <!-- Tier 2 -->
  <rect x="48" y="196" width="864" height="64" rx="12" fill="url(#t2)" stroke="#4a6fa5" stroke-width="1.5"/>
  <circle cx="88" cy="228" r="18" fill="#243656" stroke="#7eb0e0" stroke-width="2"/>
  <text x="88" y="233" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7eb0e0">2</text>
  <text x="124" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Hole-punched UDP</text>
  <text x="124" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b95a8">Authenticated probes open NAT mappings ù reliable stream over the punched path</text>
  <text x="880" y="233" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#7eb0e0">fallback</text>

  <text x="480" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6b7280">? if that fails</text>

  <!-- Tier 3 -->
  <rect x="48" y="292" width="864" height="48" rx="12" fill="url(#t3)" stroke="#c07840" stroke-width="1.5"/>
  <circle cx="88" cy="316" r="18" fill="#3a2a1a" stroke="#f0a060" stroke-width="2"/>
  <text x="88" y="321" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#f0a060">3</text>
  <text x="124" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Server relay</text>
  <text x="280" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b95a8">Opaque ciphertext only ù refused without encryption</text>
  <text x="880" y="321" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0a060">last resort</text>
</svg>
