<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="drop-zone transport ladder">
  <rect width="960" height="360" rx="16" fill="#0c1220"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f1ea">Transport ladder</text>
  <text x="40" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b95a8">Both peers walk the same tiers. A tier only wins after a two-way authenticated handshake.</text>

  <rect x="48" y="100" width="864" height="64" rx="12" fill="#152a32" stroke="#3d8f7a" stroke-width="1.5"/>
  <circle cx="88" cy="132" r="18" fill="#244840" stroke="#5ec4b4" stroke-width="2"/>
  <text x="88" y="137" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5ec4b4">1</text>
  <text x="124" y="126" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Direct TCP</text>
  <text x="124" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b95a8">Fastest path when either side can dial the other - sendfile when encryption is off</text>
  <text x="880" y="137" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5ec4b4">preferred</text>

  <text x="480" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">if that fails</text>

  <rect x="48" y="196" width="864" height="64" rx="12" fill="#152436" stroke="#4a6fa5" stroke-width="1.5"/>
  <circle cx="88" cy="228" r="18" fill="#243656" stroke="#7eb0e0" stroke-width="2"/>
  <text x="88" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7eb0e0">2</text>
  <text x="124" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Hole-punched UDP</text>
  <text x="124" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b95a8">Authenticated probes open NAT mappings - reliable stream over the punched path</text>
  <text x="880" y="233" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7eb0e0">fallback</text>

  <text x="480" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">if that fails</text>

  <rect x="48" y="292" width="864" height="48" rx="12" fill="#2a1e14" stroke="#c07840" stroke-width="1.5"/>
  <circle cx="88" cy="316" r="18" fill="#3a2a1a" stroke="#f0a060" stroke-width="2"/>
  <text x="88" y="321" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f0a060">3</text>
  <text x="124" y="312" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eef7">Server relay</text>
  <text x="280" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b95a8">Opaque ciphertext only - refused without encryption</text>
  <text x="880" y="321" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f0a060">last resort</text>
</svg>
