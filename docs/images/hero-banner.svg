<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="drop-zone">
  <rect width="1200" height="420" rx="20" fill="#0a101c"/>
  <ellipse cx="900" cy="210" rx="280" ry="160" fill="#5ec4b4" fill-opacity="0.12"/>

  <text x="64" y="120" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f4f1ea">drop-zone</text>
  <text x="64" y="168" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9aa6bc">Send files peer to peer</text>
  <text x="64" y="208" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b778c">Untrusted rendezvous - end-to-end AEAD - TCP / UDP / relay</text>

  <rect x="64" y="260" width="150" height="36" rx="18" fill="#1a2740" stroke="#3d8f7a"/>
  <text x="139" y="283" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5ec4b4">C++20 client</text>
  <rect x="230" y="260" width="170" height="36" rx="18" fill="#1a2740" stroke="#4a6fa5"/>
  <text x="315" y="283" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7eb0e0">Homebrew install</text>
  <rect x="416" y="260" width="180" height="36" rx="18" fill="#2a2118" stroke="#c07840"/>
  <text x="506" y="283" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0a060">Zero server storage</text>

  <rect x="720" y="100" width="160" height="90" rx="12" fill="#121a2b" stroke="#3d5a80"/>
  <text x="800" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8eef7">Sender</text>
  <text x="800" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8b95a8">send -t bob</text>

  <rect x="980" y="100" width="160" height="90" rx="12" fill="#121a2b" stroke="#3d5a80"/>
  <text x="1060" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8eef7">Receiver</text>
  <text x="1060" y="162" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8b95a8">accept</text>

  <rect x="820" y="250" width="220" height="70" rx="12" fill="#1a1510" stroke="#c07840"/>
  <text x="930" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f0a060">Rendezvous</text>
  <text x="930" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a7a68">switchboard only</text>

  <line x1="800" y1="190" x2="900" y2="250" stroke="#f0a060" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1060" y1="190" x2="960" y2="250" stroke="#f0a060" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="880" y1="145" x2="980" y2="145" stroke="#5ec4b4" stroke-width="3"/>
  <polygon points="980,145 970,140 970,150" fill="#5ec4b4"/>
  <text x="930" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5ec4b4">peer-to-peer</text>
</svg>
